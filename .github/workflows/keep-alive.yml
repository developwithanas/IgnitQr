# Pings the live site every 10 minutes so the free Render server does not sleep.
# Set the site link once: GitHub repo -> Settings -> Secrets and variables ->
# Actions -> Variables -> New variable: SITE_URL = https://your-site.onrender.com
name: Keep site awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/ping
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://ignitqr-kh3n.onrender.com' }}
        run: |
          echo "Pinging $SITE_URL/api/ping"
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 "$SITE_URL/api/ping"
